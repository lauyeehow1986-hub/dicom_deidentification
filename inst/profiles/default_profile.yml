# =============================================================================
# Default de-identification profile
# =============================================================================
# A profile = the identifier catalog + a set of PS3.15 option toggles + the
# replacement settings the reviewer can customise per project. Profiles are
# copied and edited in the app (mod_rules_editor); this is the shipped default.
# =============================================================================

profile_id: default
based_on: "DICOM PS3.15 Annex E - Basic Application Level Confidentiality Profile"
catalog: identifier_catalog.yml

# --- PS3.15 option flags ------------------------------------------------------
options:
  clean_descriptors: true          # run the free-text PHI detectors over descriptions/comments
  clean_pixel_data: true           # run OCR + redaction over pixels (burned-in text)
  retain_longitudinal_temporal: false  # date-shift is OPT-IN (see `dates:` below); off by default
  retain_patient_characteristics: true # keep age/sex/height/weight (research-useful, not direct IDs)
  retain_device_identity: false    # remove per-unit device serials
  retain_institution_identity: false
  retain_safe_private: false       # strip unknown private tags (allowlist known-safe only)
  retain_uids: false               # remap UIDs (U) rather than keep

# --- reversibility ------------------------------------------------------------
reversibility:
  mode: reversible                 # reversible | irreversible
  # reversible  -> keystore persists orig<->pseudonym crosswalk + salts + date offsets
  # irreversible-> salts generated per-run and discarded; no keystore written

# --- date handling (shift is OPT-IN, chosen only when needed) ------------------
dates:
  mode: remove                     # remove | shift | keep
  # remove -> X : drop all individual-linked dates (conservative default)
  # shift  -> S : per-patient, interval-preserving offset; enable ONLY when a study
  #              genuinely needs longitudinal/4D timing. Offsets are kept in the
  #              keystore (reversible mode) so intervals stay consistent per patient.
  # keep   -> K : keep as-is; use only when policy explicitly permits (e.g. dates
  #              already coarsened to year, or non-linked acquisition timings).
  offset_days_range: [-365, 365]   # used only when mode: shift
  precision: day                   # granularity preserved when shifting (day|month|year)

# --- pseudonymisation settings ------------------------------------------------
pseudonym:
  id_method: salted_sha256         # for MRN / case / visit / national-id (H action)
  salt_source: keystore            # secret salt; never committed
  hash_truncate: 16                # hex chars kept in the emitted pseudonym
  name_style: race_neutral_token   # e.g. "PATIENT_7F3A" rather than a fake real name

# --- private-tag policy -------------------------------------------------------
private_tags:
  policy: strip_unknown            # strip_unknown | keep_allowlisted | keep_all
  allowlist: []                    # vendor tags proven safe are added here over time

# --- pixel redaction ----------------------------------------------------------
pixel:
  ocr_engine: tesseract
  auto_detect: true                # propose redaction boxes from OCR+NER
  require_human_confirm: true      # reviewer confirms/edits boxes before write
  fill: black
  strip_audio: true

# --- defacing (optional, MRI only, OFF by default) ----------------------------
#   Erases the facial biometric surface from head-inclusive MR volumes.
#   DESTRUCTIVE (zeroes voxels). Enable per-run in the interactive/bulk flow.
#   FOV-gated: chest-only cardiac scans pass through untouched. MR-only:
#   head-inclusive CT is flagged for manual handling, not defaced. Needs the
#   bundled CPU model under inst/models/deface/; absent -> skipped + noted.
deface:
  enabled: false

# --- Embedded-PDF (EncapsulatedDocument) handling -------------------------------
#   remove          - strip the whole embedded PDF (default, safe, no OCR needed)
#   rasterize_redact - render pages, OCR-redact PHI, flatten to an image-only PDF
#                      (keeps the report minus PHI; needs the bundled Tesseract;
#                       degrades to `remove` when Tesseract is absent)
encapsulated_pdf:
  mode: remove
  dpi: 150

# --- text PHI detection (free-text tags, private text, SR content) ------------
# Layered scanner (see docs/text-detection.md). The deterministic layers ALWAYS
# run on the air-gapped box: header-token scrub (the study's real name/ID tokens
# hunted everywhere) + SG recognisers (NRIC/FIN checksum, phone, email). The
# gazetteer and the statistical layers light up when their data/model is present;
# otherwise the engine degrades to the deterministic layers and says so in its
# notes. It runs over every text VR the action map does not already cover,
# recursing into sequences (e.g. SR ContentSequence).
text_detection:
  enabled: true
  header_token_scrub: true         # PRIMARY: scrub the study's real name/ID tokens everywhere
  fuzzy: true
  gazetteer_file: "gazetteers/sg_names_sample.txt"  # relative to inst/; replace with your real SG name list
  use_presidio: true               # general PII; needs a spaCy model bundled on the box
  use_ner: true                    # multilingual XLM-R person/location
  ner_model: "models/xlm-roberta-base-ner-hrl"  # local NER model DIR (CPU), relative to inst/; empty -> layer off
  detect_dates: true               # scrub individual-linked dates written into FREE TEXT
                                   # (dd/mm/yyyy, yyyy-mm-dd, ISO date-time, "01 Jan 2024").
                                   # Structured DICOM date TAGS are governed by `dates.mode`.
  dates_include_bare: false        # also flag bare ddmmyyyy/yyyymmdd/yyyymmddhhmmss runs.
                                   # OPT-IN: these collide with numeric IDs; enable per project
                                   # when reviewers accept the higher false-positive rate.
  # Deterministic project rules ({category, pattern, score}) run as a
  # high-precision `custom_regex` layer that both scrubs the value during de-id
  # (fields with action C) and fails the residual QA scan (a "confident" hit).
  # OPT-IN: none ship by default -- add site-specific formats (e.g. a case /
  # accession number) via the rules editor or `add_pattern_rule`, which derives
  # the regex from a sample and writes it to your workspace profile. The bundled
  # ML layers only guess NAMES and never fire on a bare number, so a numeric
  # case-number format needs a rule here to be caught.
  custom_regex: []
